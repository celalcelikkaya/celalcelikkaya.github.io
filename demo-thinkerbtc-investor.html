<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<title>ThinkerBTC Investor portal · Live demo</title>
<link rel="icon" href="thinkerbtc/icon.png">
<style>
  html, body { height: 100%; margin: 0; background: #090a0f; }
  body { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top, 0); box-sizing: border-box; }
  #demoBar { flex: none; background: #090a0f; color: #eceef5; border-bottom: 1px solid rgba(255,255,255,.09);
    font: 500 13px/1.4 'Manrope','Segoe UI',system-ui,-apple-system,sans-serif; -webkit-user-select: none; user-select: none; }
  #demoBar .row1 { display: flex; align-items: center; gap: 8px 12px; padding: 8px 12px; }
  #demoBar a, #demoBar button { font: inherit; font-size: 13px; color: inherit; }
  #demoBar .back, #demoBar .reset { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.13); background: transparent; color: #c9cddb; text-decoration: none; cursor: pointer; white-space: nowrap;
    transition: color .15s, border-color .15s; }
  #demoBar .back:hover, #demoBar .reset:hover { color: #fff; border-color: rgba(255,255,255,.3); }
  #demoBar .tag { display: inline-flex; align-items: center; gap: 7px; font: 500 10.5px/1 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: .12em; text-transform: uppercase; color: #f5c84b; white-space: nowrap; }
  #demoBar .tag i { width: 6px; height: 6px; border-radius: 50%; background: #f5b301; box-shadow: 0 0 0 3px rgba(245,179,1,.2); }
  #demoBar .note { color: #8a90a2; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #demoBar .seg { display: inline-flex; margin-left: auto; padding: 3px; border-radius: 999px; border: 1px solid rgba(255,255,255,.13); }
  #demoBar .seg a { border: 1px solid transparent; color: #9ba1b4; padding: 5px 13px; border-radius: 999px; text-decoration: none; white-space: nowrap;
    transition: color .15s, background .15s, border-color .15s; }
  #demoBar .seg a:hover { color: #eceef5; }
  #demoBar .seg a[aria-current="page"] { color: #fff; background: rgba(245,179,1,.16); border-color: #f5b301; }
  #demoBar :focus-visible { outline: 2px solid #f5b301; outline-offset: 2px; }
  @media (max-width: 700px) {
    #demoBar .tag, #demoBar .note { display: none; }
    #demoBar .row1 { gap: 8px; }
    #demoBar .seg { margin-left: 0; flex: 1; }
    #demoBar .seg a { flex: 1; text-align: center; padding: 6px 4px; }
    #demoBar .back .lbl, #demoBar .reset .lbl { display: none; }
    #demoBar .back, #demoBar .reset { padding: 6px 11px; }
  }
  @media (prefers-reduced-motion: reduce) { #demoBar * { transition: none !important; } }
  #app { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; display: block; background: #090a0f; }
</style></head><body>
<div id="demoBar" role="region" aria-label="Demo controls">
  <div class="row1">
    <a class="back" href="./#thinkerbtc" id="dbBack" aria-label="Portfolio"><span aria-hidden="true">&larr;</span><span class="lbl" data-t="back">Portfolio</span></a>
    <span class="tag"><i></i><span data-t="tag">Live demo</span></span>
    <span class="note" data-t="note">Sample data &middot; nothing is saved</span>
    <nav class="seg" aria-label="Demo">
      <a href="demo-thinkerbtc-dashboard.html?v=1794842003"  data-t="dash">Dashboard</a>
      <a href="demo-thinkerbtc-investor.html?v=1794842003" aria-current="page" data-t="inv">Investor portal</a>
    </nav>
    <button type="button" class="reset" id="dbReset" aria-label="Reset"><span aria-hidden="true">&#8635;</span><span class="lbl" data-t="reset">Reset</span></button>
  </div>
</div>
<iframe id="app" src="thinkerbtc/demo/investor.html?v=1794842003" title="ThinkerBTC Investor portal demo" allow="clipboard-write"></iframe>
<script>
(function () {
  var T = { en: { back: 'Portfolio', tag: 'Live demo', note: 'Sample data \u00b7 nothing is saved', dash: 'Dashboard', inv: 'Investor portal', reset: 'Reset' },
            tr: { back: 'Portfolyo', tag: 'Canl\u0131 demo', note: '\u00d6rnek veri \u00b7 hi\u00e7bir \u015fey kaydedilmez', dash: 'Panel', inv: 'Yat\u0131r\u0131mc\u0131 portal\u0131', reset: 'S\u0131f\u0131rla' } };
  var lang = 'en';
  try { var s = localStorage.getItem('cc-lang'); if (s === 'tr' || s === 'en') lang = s; else if ((navigator.language || '').toLowerCase().indexOf('tr') === 0) lang = 'tr'; } catch (e) {}
  var t = T[lang]; document.documentElement.lang = lang;
  [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t[el.getAttribute('data-t')]; });
  document.getElementById('dbBack').setAttribute('aria-label', t.back);
  document.getElementById('dbReset').setAttribute('aria-label', t.reset);
  document.getElementById('dbReset').addEventListener('click', function () {
    try { Object.keys(localStorage).forEach(function (k) { if (/^(tb_|tbtc_)/.test(k)) localStorage.removeItem(k); }); } catch (e) {}
    document.getElementById('app').src = document.getElementById('app').src;
  });
})();
</script>
</body></html>
