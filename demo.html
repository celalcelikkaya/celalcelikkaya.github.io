    }

    must(api(A, 'sendTrf', { id: t2 }));

    rec(Gt, 19, 13, 'expense', 'School fees', 210000, 'Term 1 school fees');
    rec(Gt, 18, 15, 'expense', 'Health', 38500, 'Clinic visit and medicine');
    rec(Gt, 16, 9, 'inkind', 'Clothes', 0, 'Uniforms donated by a local business');
    rec(Gt, 15, 10, 'income', 'Sponsorship', 120000, 'Sponsorship, October');
    rec(Gt, 13, 12, 'expense', 'Utilities', 27000, 'Electricity and water');
    rec(Gt, 9, 9, 'expense', 'Food', 88000, 'Vegetables and rice');
    rec(Gt, 6, 10, 'income', 'Donation', 90000, 'Community donation');

    rec(Bt, 22, 9, 'income', 'Donation', 250000, 'Monthly donation \u2013 sample donor');
    rec(Bt, 21, 11, 'expense', 'Food', 102000, 'Maize flour, sugar, tea');
    rec(Bt, 19, 10, 'expense', 'School fees', 185000, 'Term 1 school fees');
    var roof = rec(Bt, 18, 14, 'expense', 'Construction', 140000, 'Dormitory roof repair');
    at(16, 15, 30);
    var edit = must(api(Bt, 'saveRec', { id: roof.id, v: { type: 'expense', cat: 'Construction', amount: 150000, date: roof.date, desc: roof.desc },
      reason: 'Corrected the amount after checking the receipt', photos: [], keep: [] }));
    var cid = chgId(edit);
    at(15, 9, 10);  must(api(A, 'askChg', { id: cid, q: 'Please attach the receipt photo.' }));
    at(14, 16, 45); must(api(Bt, 'ansChg', { id: cid, a: 'Receipt will be added tomorrow.' }));

  /* ---------- google.script.run replacement ---------- */
