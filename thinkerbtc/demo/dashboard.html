<title>ThinkerBTC · Live demo</title>
<style>
:root{
  --bg:#060608; --bg2:#13131C; --card:#13131C; --card2:#1E1E2E; --line:#2A2A3E; --line2:#3A3A52; --gold:#FFB800; --gold-glow:rgba(255,184,0,.15);
  --text:#F0F0FF; --text2:#8888AA; --text3:#55556F;
  --accent:#FFB800; --accent2:#FFD54F; --accentInk:#060608; --rgR:#46AFC0; --rgV:#A47BD6;
  --up:#3AAE78; --up-bg:rgba(58,174,120,.15); --down:#D4505A; --down-bg:rgba(212,80,90,.15); --warn:#FFB800; --warn-bg:rgba(255,184,0,.15);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme=light]{
  --gold:#C98A00; --gold-glow:rgba(201,138,0,.14);
  --bg:#F3F4F9; --bg2:#EAECF3; --card:#FFFFFF; --card2:#F1F2F8; --line:#E3E5EE; --line2:#D2D6E4;
  --text:#12131C; --text2:#565C74; --text3:#8B91A8;
  --accent:#1877D8; --accent2:#0F9DBB; --accentInk:#fff; --rgR:#1E8CA0; --rgV:#7B4BC0;
  --up:#0FA971; --up-bg:rgba(15,169,113,.10); --down:#E23558; --down-bg:rgba(226,53,88,.09); --warn:#D98A0B; --warn-bg:rgba(217,138,11,.11);
  --shadow:0 8px 24px rgba(30,35,70,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#050609;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);font-variant-numeric:tabular-nums;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}.log{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.phone{position:fixed;inset:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:12px;font-weight:600;color:var(--text2)}
.status{display:none}
#view{flex:1;-webkit-overflow-scrolling:touch;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:6px 18px 28px}
#view::-webkit-scrollbar{display:none}
.enter>*{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(7){animation-delay:.24s}.enter>*:nth-child(n+8){animation-delay:.28s}
/* live value flash */
/* the digits themselves pulse (colour + soft glow + tiny scale) - no background box */
.dl.up-t{color:var(--up)}.dl.down-t{color:var(--down)}[data-fmt=px]{transition:color .35s}[data-fmt=px]::before{content:"";display:inline-block;width:.85em;margin-right:2px;font-size:.6em;vertical-align:.12em;text-align:center}[data-fmt=px][data-dir=u]::before{content:"\25B2"}[data-fmt=px][data-dir=d]::before{content:"\25BC"}[data-fmt=px][data-dir=u]{color:var(--up)}[data-fmt=px][data-dir=d]{color:var(--down)}[data-fmt=usds],[data-fmt=pct2]{display:inline-block;transform-origin:right center}@keyframes pu{0%{text-shadow:0 0 6px rgba(58,174,120,.45)}100%{text-shadow:0 0 0 transparent}}@keyframes pd{0%{text-shadow:0 0 6px rgba(212,80,90,.5)}100%{text-shadow:0 0 0 transparent}}.pu{animation:pu .5s ease-out}.pd{animation:pd .5s ease-out}
/* skeleton */
@keyframes shimmer{100%{background-position:-200% 0}}
.sk{border-radius:14px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite linear}
#offline{position:absolute;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));height:0;z-index:30;pointer-events:none;display:flex;justify-content:center}
#offline .offpill{position:absolute;bottom:0;display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:99px;font-size:12px;font-weight:650;letter-spacing:.1px;color:var(--down);white-space:nowrap;background:linear-gradient(90deg,color-mix(in srgb,var(--down) 14%,var(--tbase)),color-mix(in srgb,var(--down) 5%,var(--tbase)));border:1px solid color-mix(in srgb,var(--down) 24%,var(--line));box-shadow:inset 0 1px 0 var(--hl),var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s cubic-bezier(.2,.9,.25,1)}
#offline.show .offpill{opacity:1;transform:none}
#offline i{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* chart scrub + range */
.chartwrap{position:relative;touch-action:pan-y;cursor:crosshair;margin-top:8px}
.chartwrap .spark{margin-top:0}
.scrub{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s}
.scrub.on{opacity:1}
.scrub .vl{position:absolute;top:0;bottom:0;width:1px;background:var(--text3)}
.scrub .pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--text);border:3px solid var(--accent);transform:translate(-50%,-50%)}
.scrub .tip{position:absolute;top:-4px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:9px;white-space:nowrap}
.rangebar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.rangebar .chips{margin:0}.rangebar .chip{height:28px;padding:0 12px;font-size:12px;background:var(--card2)}
/* position ring + glow */
.cring{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center}
.cring svg{position:absolute;inset:0;width:46px;height:46px;transform:rotate(-90deg)}
.cring .coin{width:34px;height:34px;border-radius:50%;font-size:10.5px}
.pos.near-tp{animation:glowup 2.2s ease-in-out infinite;border-color:rgba(58,174,120,.5)}
.pos.near-sl{animation:glowdn 1.4s ease-in-out infinite;border-color:rgba(212,80,90,.55)}
@keyframes glowup{50%{box-shadow:0 0 22px rgba(58,174,120,.22)}}
@keyframes glowdn{50%{box-shadow:0 0 22px rgba(212,80,90,.28)}}
.prog{font-size:11px;font-weight:700;margin-top:2px}
/* v3 additions */
.eye{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--text2)}.eye svg{width:18px;height:18px}
.eye.on{color:var(--accent)}
.mood{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.mood>div{background:var(--card2);border-radius:14px;padding:11px 12px}
.mood .v{font-size:17px;font-weight:700;margin-top:4px}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{width:14px;height:6px;border-radius:9px;background:var(--line2)}.dots i.on{background:var(--down)}
.meter{height:6px;border-radius:9px;background:var(--line2);overflow:hidden;margin-top:9px}.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.strk{color:var(--down);letter-spacing:2px;font-size:11px}
.hchart{position:relative;height:110px;display:flex;gap:3px;margin-top:12px}
.hchart div{flex:1;position:relative}.hchart i{position:absolute;left:0;right:0;border-radius:3px}
.hchart::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line2)}
.haxis{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:6px}
.donut{display:flex;align-items:center;gap:18px}.donut svg{width:112px;height:112px;flex:none;transform:rotate(-90deg)}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0;color:var(--text2)}.legend i{width:10px;height:10px;border-radius:3px}.legend b{color:var(--text);margin-left:auto;padding-left:14px}
.holdbtn{position:relative;overflow:hidden;width:100%;margin-top:16px;user-select:none;touch-action:none}
.holdbtn::before{content:"";position:absolute;inset:0;width:calc(var(--p,0)*100%);background:var(--down);opacity:.45}
.holdbtn span{position:relative}
.range .trl{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--card),0 0 8px var(--gold-glow);transform:translate(-50%,-50%)!important;top:50%;z-index:1}
#ptr{position:absolute;left:50%;top:40px;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent);opacity:0;pointer-events:none;z-index:15;box-shadow:var(--shadow)}
#ptr svg{width:18px;height:18px}#ptr.spin svg{animation:spin .8s linear infinite}
.wgt{border-radius:22px;padding:14px;background:linear-gradient(150deg,#0f2a52,#0e1220);color:#F3F4FA;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow)}
.wgt small{color:#A2A8BD;font-size:11px}.wgt .big2{font-size:26px;font-weight:750;letter-spacing:-.8px;margin-top:4px}
.sharecard{border-radius:24px;padding:22px 20px;background:radial-gradient(circle at 85% 0%,rgba(255,184,0,.45),transparent 55%),linear-gradient(160deg,#171a2b,#0b0c14);color:#F3F4FA;border:1px solid rgba(255,255,255,.08)}
/* trade detail */
.sheet{max-height:88%;overflow-y:auto;scrollbar-width:none}.sheet::-webkit-scrollbar{display:none}
.journey{position:relative;height:74px;margin:14px 0 4px}
.jt{position:absolute;left:0;right:0;top:30px;height:8px;border-radius:99px;background:var(--card2)}
.jt .seg2{position:absolute;top:0;bottom:0;border-radius:99px}
.jm{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:10.5px;font-weight:700;color:var(--text3);white-space:nowrap}
.jm::after{content:"";display:block;width:2px;height:16px;margin:2px auto 0;background:currentColor;border-radius:2px}
.jm span{display:block;font-weight:500;font-size:10.5px;color:var(--text2)}
.jm.b{top:44px}.jm.b::after{order:-1;margin:0 auto 2px}.jm.b{display:flex;flex-direction:column}
.jm.b::after{display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dgrid div{background:var(--card2);border-radius:14px;padding:11px 12px}
.dgrid .label{font-size:10px}.dgrid b{display:block;font-size:15px;margin-top:3px}
.hcard{padding:14px 16px}
.hcat{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:7px;text-transform:uppercase;background:var(--card2);color:var(--text2)}
/* editable config */
.cfg{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cfg:last-of-type{border-bottom:0}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:14px;border:1px solid var(--line);overflow:hidden;flex:none}
.stepper button{width:40px;height:44px;font-size:20px;font-weight:600;color:var(--accent);transition:background .15s}
.stepper button:active{background:var(--line)}
.stepper .sin{width:64px;height:44px;text-align:center;background:none;border:0;outline:0;font-size:16px;font-weight:700}
.stepper .unit{font-size:12.5px;color:var(--text3);font-weight:650;margin-left:-8px;margin-right:8px;width:14px}
.cfg.bad .stepper{border-color:var(--down)}
.cfg.chg .nm::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.note{font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:12px;margin-top:10px;background:var(--card2);color:var(--text2)}
.note.w{background:var(--warn-bg);color:var(--warn)}.note.e{background:var(--down-bg);color:var(--down)}
.diff{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.diff:last-child{border:0}.diff b{font-weight:700}
/* swipe actions */
.swipe{position:relative;margin-bottom:12px}
.swipe>.card{margin-bottom:0;position:relative;transition:transform .28s cubic-bezier(.2,.9,.25,1);touch-action:pan-y;user-select:none}
.sw-act{position:absolute;top:0;bottom:0;width:112px;display:flex;align-items:center;justify-content:center;border-radius:22px}
.sw-act.l{left:0;background:var(--card2);justify-content:flex-start;padding-left:16px}.sw-act.r{right:0;background:var(--down-bg);justify-content:flex-end;padding-right:16px}
.sw-act button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;width:64px}
.sw-act.l button{color:var(--accent)}.sw-act.r button{color:var(--down)}
.sw-act svg{width:22px;height:22px}
/* empty states */
.empty{text-align:center;padding:28px 16px}
.radar{position:relative;width:132px;height:132px;margin:0 auto 16px;border-radius:50%;border:1px solid var(--line2);background:
 radial-gradient(circle,var(--line2) 0 1.5px,transparent 2px),
 repeating-radial-gradient(circle,transparent 0 21px,var(--line) 21px 22px);overflow:hidden}
.radar::before,.radar::after{content:"";position:absolute;background:var(--line)}
.radar::before{left:50%;top:0;bottom:0;width:1px}.radar::after{top:50%;left:0;right:0;height:1px}
.radar i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(53,208,232,0) 0deg,rgba(53,208,232,.05) 200deg,rgba(53,208,232,.5) 358deg,rgba(150,240,255,.9) 360deg);animation:scanspin 6s linear infinite;will-change:transform;z-index:1}
.radar b{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);opacity:0;z-index:2;animation:scanblip 6s linear infinite}
@keyframes scanspin{to{transform:rotate(360deg)}}
@keyframes scanblip{0%{opacity:.95;transform:scale(1.3)}18%{opacity:.5;transform:scale(1)}55%{opacity:0}100%{opacity:0}}
@keyframes blip{0%,60%{opacity:0}70%{opacity:1}100%{opacity:0}}
/* celebration */
.cele{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cele .wash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(58,174,120,.35),transparent 60%);animation:wash 1s ease-out forwards}
@keyframes wash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.cele i{position:absolute;left:50%;top:55%;width:8px;height:8px;border-radius:3px;animation:burst 1.1s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
/* breathing brand mark */
.mark{position:relative}
.mark::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--up);opacity:.0}
.mark.live::after{animation:breathe 2.4s ease-in-out infinite}
.mark.paused::after{border-color:var(--warn);opacity:.7}
@keyframes breathe{0%,100%{opacity:0;transform:scale(.94)}50%{opacity:.75;transform:scale(1.06)}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.mark img{width:100%;height:100%;display:block;border-radius:50%}
.brand b{font-size:16px;letter-spacing:-.2px;display:block;line-height:1.1}
.brand small{font-size:11px;color:var(--text3)}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--text2)}
.pill.up{background:var(--up-bg);color:var(--up)}.pill.down{background:var(--down-bg);color:var(--down)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
h2{font-size:24px;letter-spacing:-.5px;font-weight:700}
.sub{font-size:13px;color:var(--text3);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between}
.up-t{color:var(--up)}.down-t{color:var(--down)}.muted{color:var(--text3)}.t2{color:var(--text2)}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card2),var(--card));padding:18px 18px 8px}
.hero .big{font-size:40px;font-weight:750;letter-spacing:-1.5px;margin:6px 0 2px;line-height:1}
.hero .chg{font-size:13px;font-weight:600}
.spark{display:block;width:calc(100% + 36px);margin:8px -18px 0;height:78px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px}
.stat .v{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-top:5px}
.stat .s{font-size:11.5px;color:var(--text3);margin-top:2px}
.ring{width:46px;height:46px;flex:none}
.ctl{display:flex;gap:10px;margin-bottom:12px}
.btn{height:46px;border-radius:15px;font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accentInk)}
.btn.soft{background:var(--card2);color:var(--text)}
.btn.warn{background:var(--warn-bg);color:var(--warn)}.btn.down{background:var(--down-bg);color:var(--down)}.btn.up{background:var(--up-bg);color:var(--up)}
.btn.grow{flex:1}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.sec b{font-size:16px;font-weight:700;letter-spacing:-.2px}.sec button{font-size:13px;color:var(--accent);font-weight:600}
/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.coin{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.grow1{flex:1;min-width:0}.lrow .nm{white-space:nowrap}.lrow .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-weight:650;font-size:15px}.nm small{font-weight:500;color:var(--text3);font-size:12px;margin-left:4px}
.dl{font-size:12px;color:var(--text3);margin-top:2px}
.r{text-align:right}.r b{display:block;font-size:15px;font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:7px;text-transform:uppercase}
.tag.long{background:var(--up-bg);color:var(--up)}.tag.short{background:var(--down-bg);color:var(--down)}.tag.n{background:var(--card2);color:var(--text2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text2);transition:.2s}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:15px;gap:4px;margin:6px 0 12px}
.seg button{flex:1;height:36px;border-radius:11px;font-size:13.5px;font-weight:650;color:var(--text3);transition:.2s}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 var(--line2)}
/* position card */
.pos{padding:16px}
.pos .head{display:flex;align-items:center;gap:12px}
.pos .pnl{flex:none;min-width:104px;text-align:right;white-space:nowrap}.pos .pnl b{font-size:21px;font-weight:750;letter-spacing:-.6px;display:block;line-height:1.15}.pos .pnl span{font-size:13px;font-weight:650}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tag.man{background:var(--warn-bg);color:var(--warn)}.tag.bot{background:rgba(255,184,0,.14);color:var(--accent)}
.range{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--down-bg),var(--card2) 50%,var(--up-bg));margin:20px 0 10px}
.range i{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.range .cur{width:16px;height:16px;background:var(--text);border:3px solid var(--card);box-shadow:0 0 0 2px var(--accent)}
.range .ent{width:2px;height:16px;border-radius:2px;background:var(--text3)}
.range .fill{position:absolute;top:0;bottom:0;border-radius:99px;opacity:.85}
.rl{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:11.5px;color:var(--text3);white-space:nowrap}.rl .m{text-align:center}.rl .rr{text-align:right}.rl b{color:inherit}
.rl b{font-weight:650}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kv div{background:var(--card2);border-radius:13px;padding:9px 10px}
.kv .label{font-size:9.5px}.kv b{font-size:13.5px;display:block;margin-top:3px}
/* market */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:15px;color:var(--text3)}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px}
.rsi{width:58px;margin-right:4px}.rsi .dl{white-space:nowrap}.rsi .rb{height:5px;border-radius:9px;background:var(--card2);position:relative;overflow:hidden}.rsi i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
/* bars */
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bigspark .spark{height:220px;margin:0;width:100%}
/* tabs */
#tabs{flex:none;display:flex;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line);position:relative}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--text3);transition:color .2s;position:relative}
#tabs button svg{width:22px;height:22px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#tabs button.on{color:var(--text)}
#tabs button.on svg{transform:translateY(-2px) scale(1.08);color:var(--accent)}
#tabs button.on::before{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}

.pc{--tc:var(--up);padding:16px;border-radius:18px;border-width:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 12%,var(--tbase)) 0%,color-mix(in srgb,var(--tc) 3%,var(--tbase)) 65%,var(--tbase) 100%);box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.pc.pc-up{--tc:var(--up);border-color:color-mix(in srgb,var(--up) 26%,var(--line))}
.pc.pc-dn{--tc:var(--down);border-color:color-mix(in srgb,var(--down) 26%,var(--line))}
.pc .pc-range .rest{background:var(--tbase)}
.pc .pc-range .cur{border-color:var(--tbase)}
.pc .kv div{background:var(--tbase);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 1px 0 var(--hl)}
.pc-sym{font-weight:800}.pc-pnl b{font-weight:800}
.tag{font-weight:800}
.tag.n,.tag.bot{background:color-mix(in srgb,var(--blue) 14%,var(--tbase));color:var(--blue)}
.tag.man{background:color-mix(in srgb,var(--purple) 14%,var(--tbase));color:var(--purple)}
:root{--blue:#5B8DEF;--purple:#A47BD6}:root[data-theme=light]{--blue:#2F64D6;--purple:#7B4BC0}
.sw-act{border-radius:18px}.sw-act.l{background:var(--sg2)}

/* market and more, investor portal style */
.mrow{display:flex;align-items:center;gap:12px;cursor:pointer}
.mrow .grow1{flex:1;min-width:0}.mrow .nm{white-space:nowrap}.mrow .dl{white-space:nowrap}
.mrow .coin{flex:none}
.search{background:linear-gradient(180deg,var(--sg1),var(--sg2));border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hl);border-radius:14px}
.mrow .rb{background:var(--segtrack)}
.ico{background:color-mix(in srgb,var(--gold) 12%,var(--tbase));border:1px solid color-mix(in srgb,var(--gold) 22%,var(--line));color:var(--gold)}

/* history daily and insights tint */
.card.tint{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 12%,var(--tbase)) 0%,color-mix(in srgb,var(--tc) 3%,var(--tbase)) 65%,var(--tbase) 100%);border:1px solid color-mix(in srgb,var(--tc) 24%,var(--line));box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}
.card{border:1px solid var(--line)}
.bar,.hbar{border-radius:99px}

/* interactive equity chart, selection in gold like the investor portal */
.eqp{cursor:crosshair;touch-action:pan-y}
.eqp .scrub .vl{width:0;background:none;border-left:1px dashed var(--gold)}
.eqp .scrub .pt{background:var(--gold);border:2px solid var(--tbase);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 28%,transparent)}
.eqp .scrub .tip{background:color-mix(in srgb,var(--gold) 16%,var(--tbase));color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));box-shadow:var(--shadow)}
#eqrow.sel{cursor:pointer;color:var(--gold)!important}
#pwaCard .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pwaCard .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pwaCard .btn{padding:0 14px;flex:none}

/* logo opens Settings, soft glow hints it is tappable */
.logo{cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo img{animation:logoglow 3.6s ease-in-out infinite}
@keyframes logoglow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 0%,transparent)}50%{box-shadow:0 0 14px 2px color-mix(in srgb,var(--gold) 42%,transparent)}}
.logo:active img{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.logo img{animation:none}}

/* card flip: position card turns away, market chart turns in */
#view{perspective:1200px}
.pc.flipout{transform:perspective(1000px) rotateY(90deg) scale(.96)!important;opacity:.4;transition:transform .2s cubic-bezier(.4,0,.8,.6),opacity .2s;pointer-events:none}
.flipin>*:not(.cfc){animation:flipfade .45s ease .36s both}
.flipin .cfc{animation:flipin .34s cubic-bezier(.2,.7,.2,1) both;transform-origin:50% 50%;backface-visibility:hidden}
@keyframes flipin{from{transform:perspective(1000px) rotateY(-90deg) scale(.96);opacity:.3}to{transform:perspective(1000px) rotateY(0) scale(1);opacity:1}}
@keyframes flipfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pc.flipout,.flipin>*,.flipin .cfc{animation:none!important;transition:none}}
.swipe:has(.pc.flipout) .sw-act{opacity:0;transition:opacity .08s}

/* trade sheet polish */
.journey{margin:14px 4px 4px}
.jm{font-size:11px;letter-spacing:.1px;font-variant-numeric:tabular-nums}.jm span{font-size:11px;font-variant-numeric:tabular-nums}
.jt{height:6px;top:31px;background:var(--segtrack)}
.hero2 b{font-variant-numeric:tabular-nums}
.perf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perf>div{padding:11px 14px;border-radius:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 11%,var(--tbase)),color-mix(in srgb,var(--tc) 3%,var(--tbase)) 75%);border:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));box-shadow:inset 0 1px 0 var(--hl)}
.perf .label{font-size:10px;letter-spacing:.6px}.perf b{display:block;margin-top:4px;font-size:19px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kvl{margin-top:10px;border-radius:16px;background:var(--tbase);border:1px solid var(--line);padding:2px 14px;box-shadow:inset 0 1px 0 var(--hl)}
.kvl>div{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;border-bottom:1px solid var(--line)}
.kvl>div:last-child{border-bottom:0}.kvl span{color:var(--text3);font-weight:500}.kvl b{font-weight:650;font-variant-numeric:tabular-nums}
@media (min-width:900px){.perf{grid-template-columns:repeat(4,1fr)}.kvl{columns:2;column-gap:28px}.kvl>div{break-inside:avoid}}
.h4act .btn[data-act=toggleBot]{flex:0 0 38%;padding:0 10px;white-space:nowrap}.h4act .btn[data-act=tab]{flex:1;white-space:nowrap}

/* premium duotone tab icons */
#tabs button svg{stroke-width:1.8}
svg .d{fill:currentColor;fill-opacity:0;transition:fill-opacity .2s ease}
#tabs button.on svg .d,.hico svg .d{fill-opacity:.24}

/* recent events */
.evr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.evr:last-child{border-bottom:0}
.evi{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--tbase));border:1px solid color-mix(in srgb,var(--tc) 26%,var(--line))}
.evi svg{width:15px;height:15px;stroke-width:2.1}
.evx{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.4;color:var(--text2);letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evx b{font-weight:750;color:var(--text)}.evx em{font-style:normal;font-weight:750;font-variant-numeric:tabular-nums}
.evr time{flex:none;font-size:11.5px;font-weight:600;color:var(--text3);font-variant-numeric:tabular-nums}

/* trade sheet v2: compact, fits without scrolling */
.xr{flex:none;text-align:right;display:flex;flex-direction:column;gap:2px}.xr .label{font-size:9.5px}.xr b{font-size:12.5px;font-weight:700;max-width:128px;line-height:1.2}
.hero3{--tc:var(--up);margin-top:12px;padding:12px 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 14%,var(--tbase)),color-mix(in srgb,var(--tc) 4%,var(--tbase)) 75%);border:1px solid color-mix(in srgb,var(--tc) 26%,var(--line));box-shadow:inset 0 1px 0 var(--hl)}
.hero3.tl{--tc:var(--down)}.hero3 .label{display:block}.hero3 .hp{display:block;margin-top:3px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hero3>b{font-size:32px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.jcard{margin-top:10px;padding:12px 14px 10px;border-radius:16px;background:var(--tbase);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hl)}
.jhead{display:flex;justify-content:space-between;align-items:center}.jhead .label{font-size:10px}.jmove{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.jv{position:relative;height:96px;margin:2px 4px 0}.jv.nj{height:58px}
.jv .jt{position:absolute;left:0;right:0;top:41px;height:8px;border-radius:99px;background:var(--segtrack);margin:0}.jv.nj .jt{top:38px}
.jv .jt .seg2{position:absolute;top:0;bottom:0;border-radius:99px}
.jd{position:absolute;top:45px;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--c);border:3.5px solid var(--tbase);box-shadow:0 0 0 1.5px var(--c);z-index:2}.jv.nj .jd{top:42px}
.jd.t{width:3px;height:16px;border-radius:3px;border:0;box-shadow:none;margin:-8px 0 0 -1.5px;opacity:.7;z-index:1}
.jl{position:absolute;top:0;font-size:10.5px;font-weight:600;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
.jl span{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;opacity:.75}.jl b{display:block;font-size:12.5px;font-weight:700}
.jl.l{transform:translateX(-100%);padding-right:12px;text-align:right}.jl.r{padding-left:12px}.jl.c{transform:translateX(-50%);text-align:center;top:60px}
.jv.nj .jl.c{display:none}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.ringc b{font-size:22px;font-weight:800;letter-spacing:-.6px}.ringc span{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);font-weight:700;margin-top:1px}
.perf4.p3{grid-template-columns:repeat(3,1fr);margin-top:14px}
.bw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.bw .card{margin:0}.btile{cursor:pointer}
.rghead{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px}.rgcard{padding:14px 16px}.rgcard .r{text-align:right}.rgwr{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1}.rgcard .r .label{font-size:9.5px;margin-top:4px;display:block}
.rgleg{display:flex;gap:16px;margin-top:8px}.rgleg div{margin:0;gap:6px}.rgleg b{margin-left:0;padding-left:2px}
.rgrow{padding:12px 0}.rgrow .rgdot{width:9px;height:9px;border-radius:50%;flex:none}

.perf4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.perf4>div{padding:9px 10px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 11%,var(--tbase)),color-mix(in srgb,var(--tc) 3%,var(--tbase)) 80%);border:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));box-shadow:inset 0 1px 0 var(--hl);min-width:0}
.perf4 .label{font-size:9.5px;letter-spacing:.5px}.perf4 b{display:block;margin-top:3px;font-size:14.5px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kvg{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-radius:16px;background:var(--tbase);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hl);overflow:hidden}
.kvg>div{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.kvg>div:nth-child(3n){border-right:0}.kvg>div:nth-child(n+4){border-bottom:0}
.kvg span{display:block;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);font-weight:600}.kvg b{display:block;margin-top:3px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet:has(.hero3){padding-bottom:calc(20px + env(safe-area-inset-bottom))}

/* numbers as heavy as in the investor portal */
.hero .big,.h4hero .big,.wgt .big2,.stat .v,.h4s .v,.mood .v,.h4mood .v,.pos .pnl b,.pc-pnl b,.pc-pnl span,.pc-cols b,.r b,.h4chip b,.perf b,.perf4 b,.hero3>b,.ringc b,.rgwr,.kvg b,.xr b,.kv b,.htile .nm,.btile b,.btile span,.row b,.dl b,.evx em,.h4range span,.sec span.up-t,.sec span.down-t,.kvl b{font-weight:900!important}
</style>

function tokenGate(msg){ /* asks once for BOT_DASHBOARD_TOKEN; kept only on this device */
  if(document.getElementById('tokGate'))return;
  const d=document.createElement('div');d.id='tokGate';
  d.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,10,14,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:inherit';

   +'<div style="font-size:19px;font-weight:800;margin-bottom:6px">Dashboard token</div>'
   +'<div style="font-size:13px;color:#9aa0a6;line-height:1.45;margin-bottom:14px">'+(msg||'Enter the dashboard token once. It is kept only on this device.')+'</div>'
   +'<input type="text" name="username" autocomplete="username" value="ThinkerBTC dashboard" readonly tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">'
   +'<input id="tokIn" name="password" type="password" autocomplete="current-password" placeholder="Token" style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid #2a2f38;background:#0d0f13;color:#e8eaed;font-size:15px;outline:none">'
   +'<div id="tokErr" style="color:#ff6b6b;font-size:12px;min-height:18px;margin:8px 2px 4px"></div>'
   +'<button style="width:100%;padding:12px;border:0;border-radius:12px;background:#f5b301;color:#111;font-weight:800;font-size:15px;cursor:pointer">Unlock</button>'
   +'<div style="font-size:12px;color:#9aa0a6;line-height:1.5;margin-top:14px">Your browser can save it as a password. Forgot it? On your PC run the <b>ThinkerBTC token</b> shortcut, or on the server: <code style="font-size:11px">bash ~/thinkerbtc/scripts/show_token.sh</code></div></form>';
  document.body.appendChild(d);
  const f=d.querySelector('form'),inp=d.querySelector('#tokIn'),err=d.querySelector('#tokErr');setTimeout(()=>inp.focus(),50);
  f.addEventListener('submit',async e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;err.textContent='Checking…';
    try{const r=await fetch('/api/auth',{headers:{'Authorization':'Bearer '+v},cache:'no-store'});const j=await r.json().catch(()=>({}));
      if(r.ok&&j.role==='full'){try{localStorage.setItem('tb_dash_token',v)}catch(_){}DASH_TOKEN=v;location.reload()}
      else err.textContent=r.ok?'This is the read-only key. The dashboard needs the full token.':'Wrong token.'}
    catch(_){err.textContent='Bot not reachable. Try again.'}});
}

async function api(path,opt={},ms=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  const headers={...(opt.headers||{}),'Authorization':'Bearer '+DASH_TOKEN};
  try{const r=await fetch(path,{...opt,headers,signal:c.signal,cache:'no-store'});const txt=await r.text();if(r.status===401){try{localStorage.removeItem('tb_dash_token')}catch(_){}tokenGate('The saved token was not accepted (it may have been changed on the server). Enter the current one.')}if(r.status>=500)throw new Error('HTTP '+r.status);return txt}finally{clearTimeout(t)}}

  S.btc={long:!!st.btc_long_blocked,short:!!st.btc_short_blocked};S.ws=!!st.ws_alive;S.uptime=st.uptime||'—';S.version=String(st.version||'').split('-')[0];
  S.rpm=num(st.api_rpm);S.apiPaused=!!st.api_paused;S.scanGroup=num(st.scan_group);S.lev=num(st.leverage,S.lev);S.btcAge=num(st.btc_cache_age_s);S.watched=num(st.watched_count);S.paused=!!st.paused;
  /* trades: newest first; the bot only stores a bare HH:MM:SS, so a later clock time than the newer trade means midnight passed */
  let day=0,prevS=1e9;

    const cs=clockSec(t.closed_at);if(cs>=0){if(prevS!==1e9&&cs>prevS+60)day++;prevS=cs}
    const entry=num(t.entry),exit=num(t.exit),mv=entry?Math.abs(exit-entry)/entry*100:0,pp=num(t.pnl_pct);
    const _sl=store.get('symlev',{}),_est=(mv>0.05&&pp)?Math.round(Math.abs(pp)/mv):0;
    /* leverage of a closed trade: real per-symbol leverage seen on an open position > pnl/move ratio (ignored when ~1x, which is never real) > current setting */
    const lev=num(t.leverage)||num((st.symbol_leverage||{})[t.symbol])||_sl[t.symbol]||(_est>=2&&_est<=125?_est:S.lev);
    const kind=exitKind(t.reason);
    return{symbol:t.symbol||'',side:(t.side||'').toUpperCase(),pct:pp,usdt:num(t.pnl_usdt),reason:kind,rawReason:t.reason||'',min:num(t.duration_min),score:num(t.score),day,
      time:hhmm(t.closed_at),opened:hhmm(t.opened_at),entry,exit,peak:num(t.peak)>0?num(t.peak):entry,trough:num(t.trough_price)>0?num(t.trough_price):entry,noJ:!(num(t.peak)>0&&num(t.trough_price)>0),margin:num(t.margin_usdt),lev,
      vin:num(t.vol_entry),vout:num(t.vol_exit),slMode:t.sl_mode||'closed',regime:String(t.regime||'—').toUpperCase(),manual:kind==='MAN'}});
  S.trades=trades;

  const pos=(st.positions||[]).map(p=>{
    const sym=p.symbol||'';if(S.ready&&!prev.has(sym))store.set('lev_'+sym,S.lev);
    if(num(p.actual_leverage)){const m=store.get('symlev',{});if(m[sym]!==num(p.actual_leverage)){m[sym]=num(p.actual_leverage);store.set('symlev',m)}}
    const lev=num(p.actual_leverage)||store.get('lev_'+sym,S.lev),entry=num(p.entry_price),qty=num(p.qty);
    return{symbol:sym,side:(p.side||'').toUpperCase(),entry,price:num(p.current_price,entry),tp:num(p.tp),sl:num(p.sl),trailOn:p.trail_enabled!==false,trailLock:!!p.trail_lock,botManaged:p.bot_managed!==false,trailState:p.trail_state||(p.trail_enabled===false?'off':(num(p.trail_price)&&Math.abs(num(p.trail_price)-entry)>1e-12?'active':'armed')),trail:(p.trail_state?p.trail_state==='active':p.trail_enabled!==false)?num(p.trail_price):0,
      margin:num(p.margin_usdt)||(lev?qty*entry/lev:0),lev,min:num(p.holding_min),regime:String(p.regime||p.entry_regime||'—').toUpperCase(),qty,
      manual:!!(p.manual||p.is_manual),slEx:!!p.sl_exempt,pnlUsdt:num(p.pnl_usdt)}});

      if(S.alerts.master&&S.alerts.closed){toast(sym.replace('USDT','')+' closed '+usd(r,true));if(r>0)celebrate()}}});
    pos.forEach(p=>{if(!prev.has(p.symbol)&&S.alerts.master&&S.alerts.opened)toast('Opened '+p.side+' '+p.symbol.replace('USDT',''))});
  }

  S.positions=pos;
  S.market=(st.market_watch||[]).map(m=>({symbol:m.symbol||'',price:num(m.price),rsi:num(m.rsi,50),adx:num(m.adx),regime:String(m.regime||'—').toUpperCase(),spread:num(m.spread),banned:!!m.banned,vol:num(m.vol_24h)}));

/* the bot's daily report counters are cumulative since its last reset, so a day's own figures are the difference to the day before */
function aggTrades(trs){
  const H=Array(24).fill(0),Sy={},Rg={TREND:{p:0,w:0,l:0},RANGE:{p:0,w:0,l:0},VOLATILE:{p:0,w:0,l:0}},ex={tp:0,tr:0,sl:0,tm:0};
  trs.forEach(t=>{const h=parseInt(t.opened);if(h>=0&&h<24)H[h]+=t.usdt;const k=t.symbol.replace('USDT','');Sy[k]=(Sy[k]||0)+t.usdt;
    const r=Rg[t.regime]||(Rg[t.regime]={p:0,w:0,l:0});r.p+=t.usdt;if(t.usdt>0)r.w++;else r.l++;
    if(t.reason==='TP')ex.tp++;else if(t.reason==='TRAIL'||t.reason==='UTRAIL'||t.reason==='LOCK')ex.tr++;else if(t.reason==='SL')ex.sl++;else ex.tm++});
  return{H,Sy,Rg,ex}}
function buildDaily(){
  const out=[],today=S.trades.filter(t=>t.day===0),A=aggTrades(today);
  let sw=0,sl_=0,w=0,l=0;today.forEach(t=>{if(t.usdt>0){sw+=t.usdt;w++}else{sl_+=-t.usdt;l++}});
  out.push({date:'Today',iso:todayIso(),pnl:S.dailyPnl,trades:today.length,wins:w,losses:l,pf:sl_>0?sw/sl_:0,avgW:w?sw/w:0,avgL:l?sl_/l:0,tp:A.ex.tp,tr:A.ex.tr,sl:A.ex.sl,tm:A.ex.tm,hours:A.H,syms:A.Sy,reg:Object.fromEntries(Object.entries(A.Rg).map(([k,v])=>[k,v.p]))});
  const asc=[...S.reports].filter(r=>r.date&&String(r.date).slice(0,10)!==todayIso()).sort((a,b)=>String(a.date)<String(b.date)?-1:1);
  const D=(a,b)=>Math.max(0,num(a)-num(b));
  asc.forEach((r,i)=>{const p=i?asc[i-1]:null,fresh=!p||num(r.total_trades)<num(p.total_trades);
    const g=(k)=>fresh?num(r[k]):D(r[k],p[k]);
    const wins=g('wins'),losses=g('losses');
    const sumW=num(r.avg_win_usdt)*num(r.wins)-(fresh?0:num(p.avg_win_usdt)*num(p.wins)),sumL=-(num(r.avg_loss_usdt)*num(r.losses)-(fresh?0:num(p.avg_loss_usdt)*num(p.losses)));
    const hours=Array(24).fill(0);Object.entries(r.hour_breakdown||{}).forEach(([k,v])=>{const h=+k;if(h>=0&&h<24)hours[h]=num(v.pnl)-(fresh?0:num(((p.hour_breakdown||{})[k]||{}).pnl))});
    const syms={};Object.entries(r.symbol_breakdown||{}).forEach(([k,v])=>{syms[k.replace('USDT','')]=num(v.pnl)-(fresh?0:num(((p.symbol_breakdown||{})[k]||{}).pnl))});
    const reg={};Object.entries(r.regime_breakdown||{}).forEach(([k,v])=>{reg[String(k).toUpperCase()]=num(v.pnl)-(fresh?0:num(((p.regime_breakdown||{})[k]||{}).pnl))});
    const other=g('other_count')+g('time_count')+g('liq_count');
    out.push({date:dayLabel(r.date),iso:String(r.date).slice(0,10),pnl:num(r.daily_pnl),trades:wins+losses,wins,losses,pf:sumL>0?Math.max(0,sumW)/sumL:0,avgW:wins?Math.max(0,sumW)/wins:0,avgL:losses?sumL/losses:0,
      tp:g('tp_count'),tr:g('trail_count'),sl:g('sl_count'),tm:other,hours,syms,reg})});
  const head=out[0],rest=out.slice(1).reverse();S.daily=[head,...rest];
}

  }catch(e){pollOnce.fails=(pollOnce.fails||0)+1;if(pollOnce.fails>=2)S.connected=false}

   /market/ws + SUBSCRIBE, /market/ws/<streams in the path>, and the legacy /ws, and keeps whichever delivers ticks.

  {name:'market/ws',url:()=>wxHost()+'/market/ws',sub:true},
  {name:'market/path',url:s=>wxHost()+'/market/ws/'+[...s].flatMap(x=>[x.toLowerCase()+'@aggTrade',x.toLowerCase()+'@miniTicker']).join('/'),sub:false},
  {name:'legacy',url:()=>(S.testnet?'wss://stream.binancefuture.com':'wss://fstream.binance.com')+'/ws',sub:true}];

  ws.onopen=()=>{WX.open=true;WX.retry=0;WX.subs.clear();if(!M.sub)want.forEach(x=>WX.subs.add(x));wxSync()};

function EQD(){const r=S.range;
  if(r==='1D'){const T=S.trades.filter(t=>t.day===0).reverse();let c=0;const v=[0],l=['Start'];T.forEach(t=>{c+=t.usdt;v.push(+c.toFixed(2));l.push(t.time)});if(v.length===1){v.push(0);l.push('Now')}return{v,l}}
  const n=r==='1W'?7:30,hist=S.daily.slice(1).slice(0,n-1).reverse();let c=0;const v=[0],l=['Start'];hist.forEach(d=>{c+=d.pnl;v.push(+c.toFixed(2));l.push(d.date)});v.push(+(c+S.dailyPnl).toFixed(2));l.push('Today');return{v,l}}

function evKind(t){const l=t.toLowerCase();
  if(/\bban|block|skip|cooldown/.test(l))return['gold','ev_shield'];
  if(/clos|exit/.test(l))return /[\-\u2212]\s?\$|loss|\bsl\b|stop/.test(l)?['down','ev_x']:['up','ev_check'];
  if(/\bsl\b|stop.?loss|stopped|liquidat/.test(l))return['down','ev_x'];
  if(/\btp\b|take.?profit|profit/.test(l))return['up','ev_check'];
  if(/open|entry|enter|\blong\b|\bshort\b/.test(l))return['blue','ev_plus'];
  if(/pause|resume|start|restart|mode/.test(l))return['purple','ev_bolt'];
  if(/error|fail|timeout|reject|warn|limit/.test(l))return['down','ev_alert'];
  return['gray','ev_dot']}
function evRow(e){const raw=String(e[1]).replace(/^[\s\p{Extended_Pictographic}\uFE0F\u200d]+/u,'').trim()||String(e[1]),k=evKind(raw);
  let h=esc(raw).replace(/\b([A-Z0-9]{2,10}USDT)\b/g,'<b>$1</b>').replace(/([+\-\u2212]\$?\d[\d,]*\.?\d*%?)/g,m=>`<em class="${/^\+/.test(m)?'up-t':'down-t'}">${m}</em>`);
  return `<div class="evr" style="--tc:var(${k[0]==='gray'?'--text3':'--'+(k[0]==='up'?'up':k[0]==='down'?'down':k[0])})"><i class="evi">${svg(k[1])}</i><span class="evx">${h}</span><time>${e[0]}</time></div>`}

function trailRow(p){

function posCardInner(p,sw){const q=pnlOf(p),D0=p.side==='LONG'?1:-1,lo=p.sl>0?p.sl:p.entry-D0*Math.max(Math.abs((p.tp||p.entry)-p.entry),p.entry*.01),hi=p.tp>0?p.tp:p.entry+D0*Math.max(Math.abs(p.entry-lo),p.entry*.01),span=(hi-lo)||1,at=v=>Math.max(2,Math.min(98,(v-lo)/span*100));
  const cur=at(p.price),ent=at(p.entry),win=q.usdt>=0;

  const rc=mv>=0?'var(--up)':'var(--down)',C=2*Math.PI*21,glow=prog>=.8?(mv>=0?' near-tp':' near-sl'):'';

/* live flash, count-up, offline strip */
const LAST={},DIRS={},SHOWN={};
const FM={usds:v=>usd(v,true),pct1:v=>v.toFixed(1)+'%',px:v=>px(v)};
/* glide from the last shown real value to the new real value (no invented movement) */
/* ---- live numbers: one smooth, continuous motion per value -------------------------------------------
   Every live value has a key (px:SOL, pnl:SOL, pct:SOL, open, ...). A key moves at constant speed from what is on
   screen to the newest real value, sized to the gap between real updates, so it lands as the next update arrives
   (no stop-and-go). Elements are painted directly each frame - the page is NOT re-rendered for price ticks. */
const TW={},DIRH={};
FM.pct2=v=>pct(v);FM.prog=v=>Math.round(Math.abs(v)*100)+'% '+(v>=0?'to TP':'to SL');
const SETT={
  left:(el,v)=>{el.style.left=v.toFixed(2)+'%'},
  ring:(el,v)=>{const C=2*Math.PI*21;el.setAttribute('stroke-dasharray',(C*Math.abs(v)).toFixed(2)+' '+C.toFixed(2));el.setAttribute('stroke',v>=0?'var(--up)':'var(--down)')},
  fill:(el,v)=>{const e=+el.dataset.ent;el.style.left=Math.min(e,v).toFixed(2)+'%';el.style.width=Math.abs(v-e).toFixed(2)+'%';el.style.background=v>=e?'var(--up)':'var(--down)'}
};
function twNow(tw,now){const p=Math.min(1,(now-tw.t0)/tw.dur);return p>=1?tw.to:tw.from+(tw.to-tw.from)*p}
function pushDir(k,v,now){if(!/^(px|m):/.test(k))return;const h=(DIRH[k]||[]).filter(e=>now-e.t<1500);h.push({t:now,v});DIRH[k]=h;const r=h[0];if(v!==r.v)DIRS[k]=v>r.v?'u':'d'}
function twTarget(k,v,now){const tw=TW[k];
  if(!tw){TW[k]={from:v,to:v,t0:now,dur:1,tc:now};SHOWN[k]=v;return}
  if(Math.abs(v-tw.to)<1e-12)return;
  /* no gliding / catch-up roll: show the real value at once; only a soft glow marks a meaningful P&L change */
  const pu=/^(pnl|pct):|^(open|dpnl)$/.test(k)&&Math.abs(v-tw.to)>=0.005;
  TW[k]={from:v,to:v,t0:now,dur:1,tc:now,pa:pu?now:tw.pa,pd:pu?(v>tw.to?'pu':'pd'):tw.pd};pushDir(k,v,now)}
function paint(el,now){const k=el.dataset.flash,tw=TW[k];if(!tw)return;const fm=el.dataset.fmt,v=twNow(tw,now);SHOWN[k]=v;
  const st=SETT[fm];if(st)st(el,v);else{const f=FM[fm];if(f){const t=f(v);if(el.textContent!==t)el.textContent=t}}
  const c=el.classList;if(c.contains('up-t')||c.contains('down-t')){const u=v>=0;if(c.contains('up-t')!==u){c.toggle('up-t',u);c.toggle('down-t',!u)}}
  const d=DIRS[k];if(d&&el.dataset.dir!==d)el.dataset.dir=d;
  if(tw.pa){if(el._pa===undefined)el._pa=tw.pa;else if(el._pa!==tw.pa){el._pa=tw.pa;c.remove('pu','pd');void el.offsetWidth;c.add(tw.pd)}}}
/* called after every (re)render: elements are new, so paint them at the value that is currently on screen */
function applyFlash(anim){const now=performance.now();
  document.querySelectorAll('[data-flash]').forEach(el=>{const k=el.dataset.flash,v=parseFloat(el.dataset.val);if(isNaN(v))return;
    if(anim||!TW[k]){TW[k]={from:v,to:v,t0:now,dur:1,tc:now};SHOWN[k]=v}else twTarget(k,v,now);
    paint(el,now);LAST[k]=v})}

function posGeo(p){const q=pnlOf(p),D0=p.side==='LONG'?1:-1,lo=p.sl>0?p.sl:p.entry-D0*Math.max(Math.abs((p.tp||p.entry)-p.entry),p.entry*.01),hi=p.tp>0?p.tp:p.entry+D0*Math.max(Math.abs(p.entry-lo),p.entry*.01),span=(hi-lo)||1,at=v=>Math.max(2,Math.min(98,(v-lo)/span*100));

  return{q,cur,ent,mv,prog,sprog:mv>=0?prog:-prog,at}}

     const go=()=>{S.fromPos=true;S.flipIn=true;S.tab='market';S.sub=v;closeSheet();render(true);$('#view').scrollTop=0};

     case 'pwaDismiss':store.set('pwaDismiss',Date.now());break;

   case 'step':{const c=CFGDEF.find(x=>x.k===el.dataset.k),cur=parseFloat(S.draft[c.k]);const base=isNaN(cur)?S.cfg[c.k]:cur;
     let nv=Math.min(c.max,Math.max(c.min,+(base+c.step*(+el.dataset.d)).toFixed(1)));S.draft[c.k]=c.int?Math.round(nv):nv.toFixed(1)*1;break}

     ${!S.draft.autoSl&&S.cfg.autoSl?'<div class="note w" style="margin-top:12px">With auto SL off the bot sends only a take profit order, opens new trades in ISOLATED margin and marks them SL-exempt. Open positions keep their orders. A losing trade can run until liquidation.</div>':''}<div class="ctl" style="margin:18px 0 0"><button class="btn soft grow" data-act="closeSheet">Cancel</button><button class="btn primary grow" data-act="cfgApply">Apply</button></div>`);return}
   case 'cfgApply':closeSheet();applyCfg();return;
   case 'toastSave':toast('Saved');break;

   case 'saveTpSl':{const p=S.positions.find(x=>x.symbol===v);if(!p)return;const tp=parseFloat($('#etp').value)||p.tp,sl=parseFloat($('#esl').value)||p.sl,long=p.side==='LONG';

   case 'doClose':closeSheet();delete S.swiped[v];act('/api/bot/close/'+v).then(r=>{if(!r.error){toast('Close order sent');setTimeout(pollOnce,800)}});return;

document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.cfg){const c=CFGDEF.find(x=>x.k===e.target.dataset.cfg);S.draft[c.k]=e.target.value.replace(',','.');
  const row=e.target.closest('.cfg');row.classList.toggle('bad',cfgBad(S.draft,c));row.classList.toggle('chg',String(S.draft[c.k])!==String(S.cfg[c.k]));
  const bad=CFGDEF.some(x=>cfgBad(S.draft,x)),dirty=cfgDirty(),sv=$('#cfgsave');sv.disabled=!(dirty&&!bad);sv.style.opacity=(dirty&&!bad)?'':'.4';sv.style.pointerEvents=(dirty&&!bad)?'':'none';
  $('#cfgreset').style.display=dirty?'':'none';const pl=$('#cfgpill');pl.textContent=dirty?'Unsaved changes':'Synced with bot';pl.className='pill '+(dirty?'warn':'');$('#cfgnotes').innerHTML=cfgNotes();return}if(e.target.id==='q'){S.mkQuery=e.target.value;S.keepFocus=true;render(false);S.keepFocus=false}});

function celebrate(){const ph=$('#phone'),c=document.createElement('div');c.className='cele';c.innerHTML='<div class="wash"></div>';
  const cols=['#3AAE78','#FFB800','#FFD54F','#FFB800'];

/* swipe to reveal actions */
let SW=null;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('.swipe>.card');if(!card||e.target.closest('button'))return;const sym=card.parentNode.dataset.sym;SW={card,sym,x:e.clientX,y:e.clientY,base:S.swiped[sym]||0,on:false}});
document.addEventListener('pointermove',e=>{if(!SW)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.on&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.3){SW.on=true;S.swipeActive=true;SW.card.style.transition='none'}
  if(SW.on)SW.card.style.transform=`translateX(${Math.max(-110,Math.min(110,SW.base+dx))}px)`});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{if(!SW)return;const {card,sym,x,base,on}=SW;SW=null;S.swipeActive=false;if(!on)return;S.swipeEnd=Date.now();
  const t=base+(e.clientX-x),f=t>55?100:t<-55?-100:0;S.swiped[sym]=f;card.style.transition='';card.style.transform=`translateX(${f}px)`}));

let HOLD=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('#holdbtn');if(!b)return;const t0=performance.now();HOLD={b,t0,raf:0};
  const step=n=>{if(!HOLD)return;const k=Math.min(1,(n-t0)/1200);b.style.setProperty('--p',k);if(k>=1){HOLD=null;closeAllDo();return}HOLD.raf=requestAnimationFrame(step)};HOLD.raf=requestAnimationFrame(step)});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>{if(HOLD){cancelAnimationFrame(HOLD.raf);HOLD.b.style.setProperty('--p',0);HOLD=null}}));
/* pull to refresh */
let PT=null;const PTR=()=>$('#ptr');
$('#view').addEventListener('pointerdown',e=>{const v=$('#view');if(v.scrollTop>0||S.loading||e.target.closest('.swipe>.card,#chartwrap,input,button,.chips,.stepper,textarea'))return;PT={y:e.clientY,d:0}});

['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{if(!PT)return;const go=PT.d>=45,p=PTR();PT=null;p.style.transform='';p.style.opacity=0;if(go)refreshNow()}));

/* equity scrubber */
function scrubAt(ev){const w=$('#eqp');if(!w)return;const r=w.getBoundingClientRect(),E=EQD(),d=E.v,n=d.length;
  const x=Math.max(0,Math.min(r.width,ev.clientX-r.left)),i=Math.round(x/r.width*(n-1)),mn=Math.min(0,...d),mx=Math.max(0,...d),pt=14,pb=14;
  S.eqSel=i;
  const px_=i/(n-1)*r.width,py=pt+(1-(d[i]-mn)/((mx-mn)||1))*(EQH-pt-pb);
  const sc=$('#scrub');sc.classList.add('on');sc.querySelector('.vl').style.left=px_+'px';const pe=sc.querySelector('.pt');pe.style.left=px_+'px';pe.style.top=py+'px';
  const tip=sc.querySelector('.tip');tip.textContent=(S.hide?'****':usd(d[i],true))+' \u00b7 '+(E.l[i]||'');const tw=tip.offsetWidth/2+4;tip.style.left=Math.max(tw,Math.min(r.width-tw,px_))+'px';
  const er=$('#eqrow');if(er){er.outerHTML=eqRow(E,d[n-1])}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('#chartwrap')){S.scrub=true;scrubAt(e)}});

['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{if(S.scrub){S.scrub=false}}));

(()=>{const mark=()=>{lastTouch=Date.now()};['touchstart','touchmove','wheel','pointerdown'].forEach(ev=>document.addEventListener(ev,mark,{passive:true,capture:true}));document.addEventListener('scroll',mark,true);

const mq=matchMedia('(prefers-color-scheme: light)'),onT=()=>{if(S.themeMode==='system'){S.theme=sysTheme();try{render(false)}catch(e){}}};mq.addEventListener?mq.addEventListener('change',onT):mq.addListener&&mq.addListener(onT);
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea,.log'))e.preventDefault()});document.addEventListener('dragstart',e=>e.preventDefault())})();
