.wk-panel.r::after{transform:scaleX(-1);animation-name:wkWaveBR;animation-duration:10.5s}
@keyframes wkWaveB{from{transform:translateX(14px) skewX(-2.4deg)}to{transform:translateX(-14px) skewX(2.4deg)}}
@keyframes wkWaveBR{from{transform:scaleX(-1) translateX(14px) skewX(-2.2deg)}to{transform:scaleX(-1) translateX(-14px) skewX(2.2deg)}}
.wk-panel.r::before{transform:scaleX(-1);animation-name:wkWaveR;animation-duration:8s}
@keyframes wkWave{from{transform:translateX(-18px) skewX(3.2deg)}to{transform:translateX(18px) skewX(-3.2deg)}}
@keyframes wkWaveR{from{transform:scaleX(-1) translateX(-18px) skewX(2.8deg)}to{transform:scaleX(-1) translateX(18px) skewX(-2.8deg)}}
.wk-panel.l{left:0;transform-origin:0 0;scale:.08 1;animation:wkInL 2.1s cubic-bezier(.55,.05,.25,1) .25s forwards,wkDragL 2.15s ease-out .25s both,wkBreeze 7s ease-in-out 2.4s infinite}
.wk-panel.r{right:0;transform-origin:100% 0;scale:.08 1;animation:wkInL 2.1s cubic-bezier(.55,.05,.25,1) .25s forwards,wkDragR 2.15s ease-out .25s both,wkBreezeR 8.5s ease-in-out 2.4s infinite}
@keyframes wkInL{to{scale:1 1}}
@keyframes wkDragL{0%{transform:skewX(-9deg)}55%{transform:skewX(2.5deg)}100%{transform:skewX(0)}}
@keyframes wkDragR{0%{transform:skewX(9deg)}55%{transform:skewX(-2.5deg)}100%{transform:skewX(0)}}
@keyframes wkOut{from{scale:1 1}to{scale:.08 1}}
@keyframes wkBreeze{0%,100%{transform:skewX(0)}30%{transform:skewX(-3.3deg)}65%{transform:skewX(1.8deg)}}
@keyframes wkBreezeR{0%,100%{transform:skewX(0)}35%{transform:skewX(3deg)}70%{transform:skewX(-1.9deg)}}
#wkend.open .wk-panel{animation:wkOut 1.2s cubic-bezier(.55,.05,.25,1) forwards}
.wk-box{position:relative;z-index:2;opacity:0;animation:wkFade 1.3s ease 1.9s forwards}
#wkend.open .wk-box{animation:wkFadeOut .4s ease forwards}
@keyframes wkFade{to{opacity:1}}@keyframes wkFadeOut{from{opacity:1}to{opacity:0}}
.wk-t{font-size:58px;line-height:1.05;background:linear-gradient(100deg,#F7BD4B 0,#F21D2B 30%,#FFF3C4 50%,#F21D2B 70%,#F7BD4B 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-right:6px;animation:wkShine 5s linear infinite}
@keyframes wkShine{from{background-position:100% 0}to{background-position:-150% 0}}
.wk-g{margin-bottom:10px;max-width:86vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;letter-spacing:.05em;color:rgba(243,235,221,.92);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.wk-g b{color:#F7BD4B;font-weight:800}
.wk-card{margin:18px auto 0;width:min(320px,86vw);padding:6px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(10,8,12,.62));border:1px solid rgba(247,189,75,.28);box-shadow:0 14px 34px -14px #000,inset 0 1px 0 rgba(255,255,255,.12)}
.wk-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;font-size:13px;color:#F3EBDD}
.wk-r+.wk-r{border-top:1px solid rgba(255,255,255,.1)}
.st{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.st.c{color:#FF7C86;background:rgba(255,77,90,.14);border:1px solid rgba(255,77,90,.4)}
.st.o{color:#3DDC97;background:rgba(61,220,151,.14);border:1px solid rgba(61,220,151,.4)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.r{background:#FF4D5A;box-shadow:0 0 8px #FF4D5A}
.dot.g{background:#3DDC97;box-shadow:0 0 0 0 rgba(61,220,151,.7);animation:wkLive 1.6s ease-out infinite}
@keyframes wkLive{to{box-shadow:0 0 0 8px rgba(61,220,151,0)}}
.wk-btn{display:block;margin:18px auto 0;width:min(320px,86vw);padding:15px 18px;border:0;border-radius:14px;font:800 13px/1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,#F21D2B,#ff5a3c);box-shadow:0 12px 28px -8px rgba(242,29,43,.85),inset 0 1px 0 rgba(255,255,255,.3);cursor:pointer;transition:transform .15s,filter .15s}

const hasRegime = r => !!r && !/^[\s—–-]*$/.test(String(r));
function regime(r, sym){
  r = String(r || "").trim().toUpperCase();
  if (["TREND","RANGE","VOLATILE"].includes(r)) return r;
  if (/TREND|BULL|BEAR|UP|DOWN|MOMENTUM|FLOW/.test(r)) return "TREND";

  return hasRegime(r) ? r : "N/A";   // honest: do not invent a regime
}

/* switch light / dark with a soft cross-fade instead of a hard flash */
function smoothTheme(fn){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return fn();
  if (document.startViewTransition) { try { document.startViewTransition(fn); return; } catch(e){} }
  const el = document.documentElement; el.classList.add("theme-fade"); fn();

}

/* Positions: live prices update the existing cards in place (no page rebuild), so nothing jumps while you scroll */
const posSig = () => (S?.positions || []).map(p => [p.symbol, p.side, p.tp, p.sl, p.entry_price, p.regime, p.is_manual ? 1 : 0, p.trail_enabled === false ? 0 : 1, p.trail_state || "", p.trail_lock ? 1 : 0].join("|")).join(";") + "#" + (connected ? 1 : 0);
const posStable = () => { const r = $("#posRoot"); return !!(S && !posChart && !posFlipIn && r && r.dataset.sig === posSig()); };
const posPd = v => v > 0 ? f2n(v, v < 1 ? 6 : v < 100 ? 4 : 2) : "NONE";
/* trailing stop, read-only (same data as the bot dashboard) */
const TR_SH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>';
function trailInfo(p){
  if (p.bot_managed === false || p.trail_enabled === undefined && p.trail_state === undefined) return null;
  const st = p.trail_enabled === false ? "off" : (p.trail_state || "armed"), price = num(p.trail_price), entry = num(p.entry_price);
  const long = String(p.side).toUpperCase() === "LONG", keep = st === "active" && price > 0 ? (price - entry) * (long ? 1 : -1) * num(p.qty) : 0;
  return {st, price, keep, lock: !!p.trail_lock};
}
function trailBadge(t){
  if (!t) return "";
  const lbl = t.st === "off" ? "TRAILING OFF" : t.st === "active" ? "TRAILING ON" : "TRAILING ARMED";
  return `<span class="pill trl ${t.st === "active" ? "on" : t.st}" data-lv="trb">${TR_SH}${lbl}</span>`;
}
function trailText(t){
  if (!t) return "";
  if (t.st === "off") return "Trailing stop off · only TP / SL close this trade";
  if (t.st === "armed") return "Trailing stop armed · starts once the trade is in profit";
  return `${t.lock ? "Profit lock" : "Trailing stop"} at <b>${posPd(t.price)}</b>${t.keep > 0 ? ` · locks <span class="keep">${money(t.keep)}</span>` : ""}`;
}
function posProg(p, cur, long, entry){
  const tp = num(p.tp), sl = num(p.sl), slc = sl > 0 ? sl : (long ? entry * .9 : entry * 1.1), tpc = tp > 0 ? tp : (long ? entry * 1.1 : entry * .9);
  let prog = .5; const range = long ? tpc - slc : slc - tpc;
  if (entry > 0 && range > 0){ prog = long ? (cur - slc) / range : (slc - cur) / range; prog = Math.min(1, Math.max(0, prog)); if (!isFinite(prog)) prog = .5; }
  return prog;
}
const posChartStable = () => { const r = $("#posChartRoot"); return !!(S && posChart && r && r.dataset.sym === posChart && (S.positions || []).some(p => p.symbol === posChart)); };
function patchPosChart(){
  const p = (S?.positions || []).find(x => x.symbol === posChart), root = $("#posChartRoot"); if (!p || !root) return;
  const {cur, pnl, pct} = posCalc(p), up = pnl >= 0, card = root.querySelector(".pos"); if (card) card.classList.toggle("loss", !up);
  const set = (k, txt) => { const e = root.querySelector('[data-lv="' + k + '"]'); if (!e) return; if (e.textContent !== txt) e.textContent = txt; if (k !== "mark"){ e.classList.toggle("green", up); e.classList.toggle("red", !up); } };
  set("pnl", money(pnl)); set("pct", sign(pct) + f2(Math.abs(pct)) + "%"); set("mark", posPd(cur));
}
function posFlip(card, after){

  setTimeout(() => { after(); posFlipIn = true; render(); $("#main").scrollTop = 0; }, 120);
}
function patchPos(){
  (S?.positions || []).forEach(p => {
    const card = document.querySelector('#posRoot [data-sym="' + CSS.escape(p.symbol) + '"]'); if (!card) return;
    const {cur, pnl, pct, long, entry} = posCalc(p), prev = lastPnl[p.symbol]; lastPnl[p.symbol] = pnl;
    const up = pnl >= 0; card.classList.toggle("loss", !up);
    const set = (k, txt, col) => { const e = card.querySelector('[data-lv="' + k + '"]'); if (!e) return null; if (e.textContent !== txt) e.textContent = txt; if (col){ e.classList.toggle("green", col === "g"); e.classList.toggle("red", col === "r"); } return e; };
    const pe = set("pnl", money(pnl), up ? "g" : "r");
    if (pe && prev !== undefined && Math.abs(pnl - prev) >= 0.005){ pe.classList.remove("fu", "fd"); void pe.offsetWidth; pe.classList.add(pnl > prev ? "fu" : "fd"); }
    set("pct", sign(pct) + f2(Math.abs(pct)) + "%", up ? "g" : "r"); { const pe2 = card.querySelector('[data-lv="pct"]'); if (pe2 && pe2.classList.contains("cb-pct")){ pe2.classList.toggle("g", up); pe2.classList.toggle("r", !up); pe2.classList.remove("green", "red"); } }
    set("mark", posPd(cur));
    const pr = card.querySelector('[data-lv="prog"]'); if (pr) pr.style.width = (posProg(p, cur, long, entry) * 100) + "%";
    { const t = trailInfo(p), tm = card.querySelector('[data-lv="trm"]'), tt = card.querySelector('[data-lv="trt"]');
      if (t && tm && t.price > 0) tm.style.left = (posProg(p, t.price, long, entry) * 100) + "%";

}

function tradesFiltered(){

function drawChart(){

  const fm = v => hideAmts ? MASK : (v > 0 ? "+" : v < 0 ? "-" : "") + "$" + (Math.abs(v) >= 1000 ? (Math.abs(v)/1000).toFixed(1) + "k" : Math.abs(v).toFixed(Math.abs(v) < 10 && v !== 0 ? 2 : 0));

    c.fillStyle = `rgba(${OV},.5)`; c.fillText(fm(v), pw + 6, y); });

  c.textAlign = "left"; c.fillText("#1", 0, h - 5); c.textAlign = "center"; c.fillText("#" + Math.round((N+1)/2), pw/2, h - 5); c.textAlign = "right"; c.fillText("#" + N, pw, h - 5);
  const g = c.createLinearGradient(0,T,0,T+ph); g.addColorStop(0, col+"40"); g.addColorStop(1, "transparent");

  c.beginPath(); pts.forEach((v,i)=> i ? c.lineTo(X(i),Y(v)) : c.moveTo(X(i),Y(v))); c.strokeStyle = col; c.lineWidth = 2.5; c.lineJoin = c.lineCap = "round"; c.stroke();
  const k = chartIdx >= 0 && chartIdx < N ? chartIdx : N-1;
  if (chartIdx >= 0){ c.setLineDash([6,6]); c.strokeStyle = gold; c.lineWidth = 1; c.beginPath(); c.moveTo(X(k),T); c.lineTo(X(k),T+ph); c.stroke(); c.setLineDash([]); }
  c.fillStyle = chartIdx >= 0 ? gold : col; c.beginPath(); c.arc(X(k),Y(pts[k]),5,0,7); c.fill();
  const v = pts[k];
  $("#chLbl").textContent = chartIdx >= 0 ? "Cumulative at selected trade" : "Net Cumulative Return";
  $("#chVal").textContent = `${money(v)} USDT`; $("#chVal").style.color = v >= 0 ? "var(--green)" : "var(--red)";
  $("#chTag").textContent = chartIdx >= 0 ? `Trade #${k+1}` : `${N} Trades`;
  const pick = e => { const r = cv.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; chartIdx = Math.round(x / Math.max(1, r.width - R) * (N-1)); chartIdx = Math.max(0, Math.min(N-1, chartIdx)); drawChart(); };
  cv.onpointerdown = pick; cv.onpointermove = e => { if (e.buttons || e.pointerType === "touch") pick(e); };
}

<script>
/* Phase 7 banner. Change P7_END to move the end date; after it the banner never shows again. */
(function(){
  var P7_END = Date.UTC(2026,10,17,0,0,0); /* 17 Nov 2026 00:00 UTC = 5 days from 12 Nov 2026 */
  var el=document.getElementById("p7"); if(!el) return;
  function left(){return P7_END-Date.now()}
  function gone(){return left()<=0}
  var dismissed=false; try{dismissed=sessionStorage.getItem("p7_x")==="1"}catch(e){}
  function render(){
    if(gone()){el.remove();return}
    var ms=left(), d=Math.ceil(ms/864e5), n=document.getElementById("p7n"), u=document.getElementById("p7u");
    if(ms<864e5){n.textContent=Math.max(1,Math.ceil(ms/36e5));u.textContent="HRS LEFT"}
    else{n.textContent=d;u.textContent=d===1?"DAY LEFT":"DAYS LEFT"}
  }
  if(gone()){el.remove();return}
  render(); if(!dismissed) el.hidden=false;
  document.getElementById("p7x").onclick=function(){el.hidden=true;try{sessionStorage.setItem("p7_x","1")}catch(e){}};
  setInterval(render,60000);
  setTimeout(function(){el.remove()},Math.min(left(),2147483647));
})();
</script>

.cb-tbl th{color:var(--tx2);font-weight:500;font-size:12.5px;text-align:left;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.cb-tbl td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.cb-tbl tr:last-child td{border-bottom:0}
.cb-tbl tbody tr{cursor:pointer;transition:background .12s}
.cb-tbl tbody tr:hover{background:var(--gold-glow)}
.cb-tbl .r{text-align:right}
.cb-tbl td small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.cb-tbl td b.num{font-size:15px}
.cb-coin{display:inline-flex;align-items:center;gap:10px}
.cb-coin .cb-ic{width:32px;height:32px;font-size:9.5px}
.cb-coin b{font-size:15px}
.cb-latest{font-size:11.5px;font-weight:600;color:var(--cb-blue);background:var(--gold-glow);padding:2px 8px;border-radius:999px}
@media (min-width:1100px){
  .d-only{display:block!important}
  table.d-only{display:table!important}
  .m-only{display:none!important}
  #main>*{max-width:1280px;margin-left:auto!important;margin-right:auto!important}
  .top{padding:22px 32px 6px!important}
  .cb-dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:6px 32px 40px;align-items:start}
  .cb-l,.cb-r{display:flex;flex-direction:column;gap:20px;min-width:0}
  .cb-dash .pad{padding:0!important;margin-top:0!important}
  .cb-heroc{background:var(--cb-card);border-radius:20px;padding:26px 28px 18px}
  .cb-heroc .cb-bal{text-align:left;padding-top:0}
  .cb-heroc .cb-big{font-size:46px}
  .cb-heroc .cb-chart{height:220px;margin:18px 0 0}
  .cb-heroc .cb-svg{height:220px}
  .cb-heroc .cb-ranges{justify-content:flex-start;margin-top:12px}
  .cb-r .cb-acts{flex-direction:column;gap:10px;background:var(--cb-card);border-radius:20px;padding:16px!important}
  .cb-r .cb-acts button{flex:none;height:46px}
  .cb-r .cb-tiles{grid-template-columns:1fr;gap:10px}
  .cb-r .cb-tile{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}
  .cb-r .cb-tile b{margin-top:0;font-size:20px}
  .cb-r .cb-tile small{font-size:14px}
  .cb-sec{padding:8px 22px 12px!important}
  .hdr{padding:30px 32px 18px!important}
  .hdr h1{font-size:34px!important}
  #main .pad{padding-left:32px;padding-right:32px}
  .hp .segc{max-width:520px}
}

@media (min-width:1100px) and (max-width:1319px){.cb-tbl .cx{display:none}}
@media (min-width:1100px){.cb-sec:has(.cb-tbl){overflow-x:auto}}

(function(){
  const TOUR_KEY = "tbtc_tour_done";
  /* Tour versions: every step has v = the tour version that introduced it.
     When a feature is added, give its new step(s) v: TOUR_VERSION + 1 and raise TOUR_VERSION.
     Investors who already saw an older tour then get a short "What's new" tour with only those steps. */
  const TOUR_VERSION = 2;
  const seenVersion = () => { const v = parseInt(store.get(TOUR_KEY) || "0", 10); return isNaN(v) ? 0 : v; };
  let mode = "full", fromV = 0;
  const card = txt => [...document.querySelectorAll("#main .card, #main .hero")].find(c => c.textContent.includes(txt));
  const hasPos = () => (S?.positions || []).length > 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const closeSheet = () => { const h = $("#modalHost"); if (h) h.innerHTML = ""; };
  const goScreen = async s => { closeSheet(); if (screen !== s) { setScreen(s); await sleep(350); } };
  const steps = [
    {intro: true, title: () => mode === "new" ? "What's new" : `Welcome, ${esc(store.get("tbtc_name") || "Investor")}`, text: () => mode === "new" ? `Your portal has ${newCount()} new feature${newCount() === 1 ? "" : "s"} since your last visit. Here is a quick look.` : "This is your live window into the ThinkerBTC trading bot. Take a 1-minute tour to see what everything means and what you can tap. The tour uses example figures; your own portfolio is back as soon as it ends. You can skip at any time.", screen: "dash", v: 1},
    {v: 1, target: () => $("#openSettings"), screen: "dash", title: "Settings live here", text: "Tap the <b>logo</b> in the top corner any time to open your settings. If you skip this tour now, you can replay it from there."},
    {v: 1, target: () => $("#tourRow") || $("#modalHost .sheet"), screen: "dash", title: "Your settings", text: "Theme, hide balances, add the portal to your home screen like an app, change your name, and <b>Take the tour</b> to see this walkthrough again.",
      before: async () => { showSettings(); await sleep(350); const r = $("#tourRow"); if (r) r.scrollIntoView({block: "center"}); await sleep(200); }, after: async () => { closeSheet(); }},
    {v: 2, target: () => $(".bn-val"), screen: "dash", title: "Your balance", text: "Your current account balance on Binance Futures, with today's change under it. The blue line is the running result of the closed trades; switch between the last 10, 25 or all trades. Tap the <b>eye</b> icon to hide all dollar amounts (handy in public)."},
    {v: 2, target: () => $(".bn-kv"), screen: "dash", title: "Open and total P&L", text: "<b>Open P&amp;L</b> is the profit or loss of the trades open right now, updated every second. <b>Total P&amp;L</b> is the result of every trade the bot has closed, next to the win rate."},
    {v: 2, target: () => $(".bn-tabs"), screen: "dash", title: "Open positions", text: "The trades open right now with their live result. Tap one to see all its details."},
    {v: 1, target: () => card("Bot health"), screen: "dash", title: "Bot health", text: "Shows that the bot is connected, how long it has been running, and when it last traded."},
            {v: 1, target: () => $("#posRoot .pos") || $("#main .center"), screen: "pos", title: "Positions", text: () => hasPos()
        ? "Each card is a live trade: its result, entry and mark price, take profit, stop loss, size and margin. The line at the bottom shows where profit is locked."
        : "Open trades appear here as live cards with entry, take profit, stop loss and the locked profit. There are no open trades right now."},
    {v: 1, target: () => $("#posChartRoot .pos"), screen: "pos", skip: () => !hasPos(), title: "Tap a card for its chart", text: "Tapping a position card flips it over to a live chart. Tap the header or <b>Back to positions</b> to flip it back.",
      before: async () => { posChart = null; render(); await sleep(150); const c = $("#posRoot .pos"); if (c) { c.click(); await sleep(650); } },
      after: async () => { if (posChart) { const b = $("#posChartRoot [data-pback]"); if (b) b.click(); await sleep(450); } }},
    {v: 1, target: () => $('nav button[data-s="perf"]'), screen: "perf", title: "Performance", text: "Win rate, best and worst trades, and how the bot does in each market type."},
    {v: 1, target: () => $('nav button[data-s="hist"]'), screen: "hist", title: "History", text: "Every closed trade with its result and exit reason. Filter by period or by coin, and tap a trade for its details."},
    {target: () => $("#openSettings"), title: "You're all set", text: "Replay the full tour any time: tap the <b>logo</b> → <b>Take the tour</b>.", screen: "dash", last: true, v: 1}
  ];
  let i = 0, root = null, raf = 0, active = false, busy = false;
  function newCount(){ return steps.filter(s => !s.intro && !s.last && (s.v || 1) > fromV).length; }
  function list(){
    return steps.filter(s => !(s.skip && s.skip()) && (mode === "full" || s.intro || s.last || (s.v || 1) > fromV));
  }
  function place(){
    if (!active || !root) return;
    const L = list(), st = L[i], spot = root.querySelector(".t-spot"), tip = root.querySelector(".t-tip");
    const el = st && st.target ? st.target() : null, W = innerWidth, H = innerHeight, pad = 8;
    let r = null;
    if (el){ const b = el.getBoundingClientRect(); if (b.width && b.height) r = {l: Math.max(4, b.left - pad), t: Math.max(4, b.top - pad), w: Math.min(W - 8, b.width + pad*2), h: Math.min(H - 8, b.height + pad*2)}; }
    spot.classList.toggle("none", !r);
    if (r){ spot.style.left = r.l + "px"; spot.style.top = r.t + "px"; spot.style.width = r.w + "px"; spot.style.height = r.h + "px"; }
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x, y;
    if (!r){ x = (W - tw) / 2; y = (H - th) / 2; }
    else {
      const below = r.t + r.h + 14, above = r.t - th - 14;
      if (below + th <= H - 10) y = below; else if (above >= 10) y = above; else y = Math.min(H - th - 10, Math.max(10, r.t + r.h - th - 10));
      x = Math.min(W - tw - 16, Math.max(16, r.l + r.w / 2 - tw / 2));
    }
    tip.style.left = x + "px"; tip.style.top = y + "px";
    raf = requestAnimationFrame(place);
  }
  async function show(n){
    if (busy) return; busy = true;
    const L = list(), prev = L[i];
    if (prev && prev.after && n !== i) await prev.after();
    i = Math.max(0, Math.min(n, L.length - 1));

    if (st.screen) await goScreen(st.screen);
    if (st.before) await st.before();
    const el = st.target ? st.target() : null;
    if (el && el.scrollIntoView){ el.scrollIntoView({block: "center", behavior: "smooth"}); await sleep(380); }
    const T = v => typeof v === "function" ? v() : v;
    tip.innerHTML = `<div class="t-step">${i === 0 ? (mode === "new" ? "WHAT'S NEW" : "QUICK TOUR") : `${mode === "new" ? "NEW" : "STEP"} ${i} OF ${L.length - 1}`}</div><div class="t-title">${T(st.title)}</div><div class="t-text">${T(st.text)}</div>
      <div class="t-foot"><div class="t-dots"><i style="width:${Math.round(i / (L.length - 1) * 100)}%"></i></div>
      ${st.last ? "" : `<button class="t-skip" data-t="skip">Skip</button>`}${i > 0 && !st.last ? `<button class="t-back" data-t="back">Back</button>` : ""}<button class="t-next" data-t="next">${st.last ? "Done" : i === 0 ? "Start" : "Next"}</button></div>`;
    tip.classList.add("on"); busy = false;
  }
  async function end(){
    if (!active) return; active = false; cancelAnimationFrame(raf);
    const st = list()[i]; if (st && st.after) await st.after();
    closeSheet(); store.set(TOUR_KEY, String(TOUR_VERSION));
    if (root) root.remove(); root = null;
    window.__tourMode = false; posChart = null; lastTxt = ""; await pollState();
    if (screen !== "dash") setScreen("dash");
  }
  window.startTour = function(m){
    if (active) return; closeSheet(); active = true; i = 0;
    mode = m === "new" ? "new" : "full"; fromV = mode === "new" ? seenVersion() : 0;
    window.__tourMode = true; lastTxt = ""; pollState();
    root = document.createElement("div"); root.id = "tourRoot";
    root.innerHTML = `<div class="t-spot none"></div><div class="t-tip" role="dialog" aria-live="polite"></div>`;
    root.addEventListener("click", e => { e.stopPropagation(); e.preventDefault(); const b = e.target.closest("[data-t]"); if (!b || busy) return;
      const a = b.dataset.t; if (a === "skip") end(); else if (a === "back") show(i - 1); else if (list()[i].last) end(); else show(i + 1); }, true);
    document.body.appendChild(root);
    document.addEventListener("keydown", onKey);
    show(0); raf = requestAnimationFrame(place);
  };
  function onKey(e){ if (!active) return document.removeEventListener("keydown", onKey); if (e.key === "Escape") end(); else if (e.key === "ArrowRight") show(i + 1); else if (e.key === "ArrowLeft" && i > 0) show(i - 1); }
  // first visit: start once the data is on screen (not during the weekend screen)
  const autoTimer = setInterval(() => {
    const seen = seenVersion();
    if (seen >= TOUR_VERSION || !store.get("tbtc_name")) { if (seen >= TOUR_VERSION) clearInterval(autoTimer); return; }
    if (!S || typeof loading !== "undefined" && loading) return;
    if (typeof isWeekend === "function" && isWeekend()) return;
    if (!$(".bn-val")) return;
    clearInterval(autoTimer); setTimeout(() => { const v = seenVersion(); if (v < TOUR_VERSION) window.startTour(v === 0 ? "full" : "new"); }, 900);
  }, 700);
})();
